<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown WYSIWYG editor</title>
    <link rel="stylesheet" href="main.css">
    <script type="importmap">
        {
            "imports": {
                "@speed-highlight/core": "https://cdn.jsdelivr.net/npm/@speed-highlight/core@1/dist/index.js",
                "markdown-tokens": "https://cdn.jsdelivr.net/npm/markdown-tokens@0.1.3-gemini3flash-antigravity"
            }
        }
    </script>
    <script src="main.js" type="module"></script>
</head>
<body class="app">
    <div class="app__output"></div>
    <textarea
        class="app__input"
        aria-label="Markdown input"
        name="input"
        autofocus
    ></textarea>
</body>
</html>
